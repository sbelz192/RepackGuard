<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>RepackGuard — Promo-Tile</title>
<style>
  html,body{margin:0;height:100%}
  body{width:1400px;height:560px;overflow:hidden;background:#0b1220;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#e5e9f0;
       display:grid;grid-template-columns:auto 1fr;align-items:center;gap:70px;
       padding:0 90px;box-sizing:border-box;
       background-image:radial-gradient(900px 500px at 78% 20%,#132545 0%,transparent 60%)}
  img{width:230px;height:230px;border-radius:52px;box-shadow:0 24px 70px rgba(37,99,235,.4)}
  .k{color:#7dd3fc;font-size:15px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 14px}
  h1{font-size:64px;line-height:1.05;margin:0 0 22px;letter-spacing:-.02em}
  h1 span{color:#7dd3fc}
  p{font-size:21px;color:#aab4c6;margin:0;max-width:760px;line-height:1.5}
  .tag{display:inline-block;margin-top:26px;border:1px solid #26324a;background:#131c2e;
       color:#fbbf24;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:600}
</style>
</head>
<body>
  <img src="../icon.png" alt="RepackGuard">
  <div>
    <div class="k">Open Source · Windows · Browser</div>
    <h1>Repack<span>Guard</span></h1>
    <p>Erkennt, wenn Installer den Virenschutz aushebeln — und warnt vor
       Scam-Seiten, bevor sie laden.</p>
    <div class="tag">Kostenlos · MIT-Lizenz</div>
  </div>
</body>
</html>
